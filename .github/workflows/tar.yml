name: Auto Package Tailscale Scripts

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/*"
      - "tools/package-cli.sh"

permissions:
  contents: write

concurrency:
  group: package-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package_and_push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI archive
        run: sh tools/package-cli.sh

      - name: Publish updated archive and installer to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          for attempt in 1 2 3; do
            git add -- tailscale-openwrt-scripts.tar.gz install.sh
            if git diff --cached --quiet; then
              exit 0
            fi
            base=$(git rev-parse HEAD)
            git commit -m '更新 CLI 脚本归档和安装校验值'
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi

            # 仅当远端分支已前进时重建，避免旧归档覆盖并发合入的脚本。
            git fetch origin refs/heads/main
            if [ "$attempt" = 3 ] || [ "$(git rev-parse FETCH_HEAD)" = "$base" ]; then
              exit 1
            fi
            git checkout --detach FETCH_HEAD
            sh tools/package-cli.sh
          done
